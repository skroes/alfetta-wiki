name: build

# PR-gate: draait hetzelfde als de Vercel-deploy (install + prebuild-validator
# + next build + postbuild) zodat breuk zichtbaar is vóór er iets live gaat.
# Node en pnpm zijn gepind zodat CI en Vercel dezelfde omgeving bouwen.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Leest de pnpm-versie uit het packageManager-veld in package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile, zoals Vercel)
        run: pnpm install --frozen-lockfile

      - name: Build (prebuild bronregel-validator + next build + sitemap/llms)
        run: pnpm build

      - name: Lint
        run: pnpm lint
